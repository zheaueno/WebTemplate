  <rect x="9" y="5" width="6" height="3" fill="#F4F6FF"/>
  <rect x="10" y="5" width="4" height="2" fill="#9775FA"/>
  <!-- Main Fuselage & Cockpit -->
  <rect x="8" y="8" width="8" height="6" fill="#F4F6FF"/>
  <rect x="8" y="8" width="1" height="6" fill="#99A6CC"/>
  <rect x="15" y="8" width="1" height="6" fill="#99A6CC"/>
  <rect x="10" y="8" width="4" height="4" fill="#080B1A"/>
  <rect x="10" y="8" width="3" height="3" fill="#64E9FF"/>
  <rect x="10" y="8" width="2" height="1" fill="#F4F6FF"/>
  <!-- Swept Wings -->
