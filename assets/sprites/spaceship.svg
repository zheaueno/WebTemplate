  <!-- Engine Bay -->
  <rect x="8" y="14" width="8" height="2" fill="#99A6CC"/>
  <rect x="9" y="16" width="2" height="2" fill="#151B35"/>
  <rect x="13" y="16" width="2" height="2" fill="#151B35"/>
  <rect x="11" y="16" width="2" height="1" fill="#FF77C8"/>
  <!-- Thruster Flames -->
  <rect x="9" y="18" width="2" height="2" fill="#FF77C8"/>
  <rect x="13" y="18" width="2" height="2" fill="#FF77C8"/>
  <rect x="11" y="17" width="2" height="3" fill="#64E9FF"/>
  <rect x="9" y="20" width="2" height="2" fill="#FFE59A"/>
  <rect x="13" y="20" width="2" height="2" fill="#FFE59A"/>
