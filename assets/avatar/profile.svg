<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="192" height="192" shape-rendering="crispEdges">
  <!-- Deep Space Background -->
  <rect width="24" height="24" fill="#080B1A"/>
  <!-- Cosmic Nebula Backdrop -->
  <rect x="2" y="3" width="3" height="2" fill="#151B35"/>
  <rect x="18" y="4" width="4" height="2" fill="#151B35"/>
  <rect x="3" y="2" width="1" height="1" fill="#FFE59A"/>
  <rect x="20" y="3" width="1" height="1" fill="#64E9FF"/>
  <rect x="2" y="16" width="1" height="1" fill="#FF77C8"/>
  <rect x="21" y="14" width="1" height="1" fill="#FFE59A"/>

  <!-- Astronaut Helmet Outer Border (Cosmic Purple & Soft White) -->
  <rect x="7" y="4" width="10" height="1" fill="#9775FA"/>
  <rect x="6" y="5" width="12" height="1" fill="#F4F6FF"/>
  <rect x="5" y="6" width="14" height="10" fill="#F4F6FF"/>
  <!-- Helmet Ear Modules -->
  <rect x="4" y="9" width="1" height="4" fill="#FF77C8"/>
  <rect x="19" y="9" width="1" height="4" fill="#FF77C8"/>
  <rect x="3" y="10" width="1" height="2" fill="#64E9FF"/>
  <rect x="20" y="10" width="1" height="2" fill="#64E9FF"/>
  <!-- Antenna -->
  <rect x="19" y="5" width="1" height="4" fill="#99A6CC"/>
  <rect x="19" y="4" width="1" height="1" fill="#FFE59A"/>

  <!-- Helmet Shading -->
  <rect x="6" y="15" width="12" height="1" fill="#99A6CC"/>
  <rect x="5" y="14" width="1" height="2" fill="#99A6CC"/>
  <rect x="18" y="14" width="1" height="2" fill="#99A6CC"/>

  <!-- Visor Frame -->
  <rect x="7" y="7" width="10" height="7" fill="#151B35"/>
  <rect x="6" y="8" width="12" height="5" fill="#151B35"/>
  <!-- Visor Glass Reflection & Cosmic Glow -->
  <rect x="7" y="8" width="10" height="5" fill="#080B1A"/>
  <rect x="8" y="8" width="3" height="1" fill="#64E9FF"/>
  <rect x="7" y="9" width="2" height="2" fill="#64E9FF"/>
  <rect x="15" y="11" width="2" height="1" fill="#9775FA"/>
  <!-- Pixel Eyes / HUD inside Visor -->
  <rect x="9" y="10" width="2" height="2" fill="#FFE59A"/>
  <rect x="13" y="10" width="2" height="2" fill="#FFE59A"/>

  <!-- Spacesuit Shoulders & Chestplate -->
  <rect x="6" y="16" width="12" height="2" fill="#9775FA"/>
  <rect x="4" y="18" width="16" height="6" fill="#F4F6FF"/>
  <rect x="4" y="18" width="3" height="2" fill="#FF77C8"/>
  <rect x="17" y="18" width="3" height="2" fill="#FF77C8"/>
  <!-- Chest Control Core -->
  <rect x="9" y="19" width="6" height="4" fill="#151B35"/>
  <rect x="10" y="20" width="2" height="2" fill="#64E9FF"/>
  <rect x="13" y="20" width="1" height="1" fill="#FF77C8"/>
  <rect x="13" y="21" width="1" height="1" fill="#FFE59A"/>
</svg>
